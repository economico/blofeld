[package]
name = "blofeld"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Fast, zero-config property-based testing and autonomous fuzzing for MCP servers"
authors = ["Economico, LLC"]
license = "MIT"
repository = "https://github.com/economico/blofeld"
homepage = "https://github.com/economico/blofeld"
readme = "README.md"
keywords = ["mcp", "testing", "fuzzing", "property-testing", "hegel"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = ["assets/*", ".github/*", "site/*"]

[dependencies]
antithesis_sdk = { version = "0.4", default-features = false, features = ["full"] }
anyhow = "1"
cel = { version = "0.16", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
hegeltest = { version = "0.54", features = ["serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
url = "2"
